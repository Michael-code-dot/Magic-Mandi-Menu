<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Magic Mandi & Grill</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="hero">
    <img 
        src="{{ url_for('static', filename='images/header-banner.jpg') }}" 
        alt="Magic Mandi & Grill" 
        class="header-banner">
</header>

<!-- ================= SEARCH ================= -->
<div class="search-box">
    <input
        type="text"
        id="searchFood"
        placeholder="🔍 Search meals or drinks...">
</div>

<!-- ================= CATEGORY MENU ================= -->
<div class="category-nav">
    <button onclick="filterCategory('All')">🍽 All</button>
    <button onclick="filterCategory('Soups')">🍲 Soups</button>
    <button onclick="filterCategory('Classic Breakfast')">🍳 Breakfast</button>
    <button onclick="filterCategory('Salads')">🥗 Salads</button>
    <button onclick="filterCategory('Magic Mandi Corner')">🍛 Mandi</button>
    <button onclick="filterCategory('Pasta')">🍝 Pasta</button>
    <button onclick="filterCategory('Grill Point')">🔥 Grill</button>                                                           
    <button onclick="filterCategory('Curries')">🍛 Curries</button>
    <button onclick="filterCategory('Pizza')">🍕 Pizza</button>
    <button onclick="filterCategory('Fries & Burgers')">🍔 Burgers</button>
    <button onclick="filterCategory('Hot Drinks')">☕ Hot Drinks</button>
    <button onclick="filterCategory('Milkshakes')">🥤 Milkshakes</button>
    <button onclick="filterCategory('Smoothies')">🥤 Smoothies</button>
    <button onclick="filterCategory('Fresh Juice')">🍹 Fresh Juices</button>
    <button onclick="filterCategory('Lemonades')">🍋 Lemonades</button>
    <button onclick="filterCategory('Mojitos')">🍸 Mojitos</button>
    <button onclick="filterCategory('Kids Special Menu')">🧒 Kids</button>
</div>

<!-- ================= TABLE ================= -->
<div class="table-card">
    <h2>📍 Table {{ table }}</h2>
</div>

<!-- ================= MENU ================= -->
<section id="menu-section">
    <div class="container">
        {% for item in menu %}
        <div class="card" data-category="{{ item.category }}">
            {% if item.image %}
            <img
                src="{{ url_for('static', filename='images/' + item.image) }}"
                class="food-image">
            {% else %}
            <img
                src="{{ url_for('static', filename='images/default.jpg') }}"
                class="food-image">
            {% endif %}

            <div class="card-body">
                <span class="category">
                    {{ item.category }}
                </span>
                <h2>{{ item.name }}</h2>
                <p class="description">
                    {{ item.description }}
                </p>
                <h3>KSh {{ item.price }}</h3>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<footer>
    <p>© 2026 Magic Mandi & Grill</p>
    <p style="color:#FFD700;">Taste The Legacy</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Set up the intersection observer to watch for elements on screen
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('show'); // Triggers the CSS animation
            }
        });
    }, {
        threshold: 0.15 // Triggers when 15% of the item is visible on screen
    });

    // Target all food cards or menu items
    const foodCards = document.querySelectorAll('.food-card');
    foodCards.forEach(card => observer.observe(card));
});
</script>

</body>
</html>
