<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu - Magic Mandi & Grill</title>
    <!-- Using Bootstrap for a clean, modern design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Manage Menu Items</h2>
        <div>
            <a href="/admin" class="btn btn-secondary">Back to Admin</a>
            <a href="/add_menu" class="btn btn-success">➕ Add New Dish</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Dish Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- This loops through every item in your Aiven Database -->
                        {% for item in menu %}
                        <tr>
                            <td>{{ item.id }}</td>
                            <td><strong>{{ item.name }}</strong></td>
                            <td><span class="badge bg-secondary">{{ item.category }}</span></td>
                            <td>KSh {{ item.price }}</td>
                            <td>
                                <a href="/edit_menu/{{ item.id }}" class="btn btn-sm btn-primary">✏️ Edit</a>
                                <a href="/delete_menu/{{ item.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete {{ item.name }}? This cannot be undone.');">🗑️ Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                No menu items found in the database.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
