<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu - Magic Mandi & Grill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #ff6a00, #ee0979);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
        }
        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        
        /* Transparent Table Styles */
        .table-glass th {
            background: rgba(0, 0, 0, 0.3) !important;
            color: white !important;
            border-bottom: 2px solid rgba(255,255,255,0.2) !important;
        }
        .table-glass td {
            background: transparent !important;
            color: white !important;
            border-bottom: 1px solid rgba(255,255,255,0.1) !important;
        }
        .table-hover tbody tr:hover td {
            background: rgba(255,255,255,0.1) !important;
        }
        .glass-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; }
        .glass-btn:hover { background: rgba(255,255,255,0.4); color: white; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Manage Menu Items</h2>
        <div>
            <a href="/admin" class="btn glass-btn">⬅️ Back to Admin</a>
            <a href="/add_menu" class="btn btn-light fw-bold shadow-sm">➕ Add New Dish</a>
        </div>
    </div>

    <div class="glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle table-glass mb-0">
                    <thead>
                        <tr>
                            <th class="py-3 px-4">ID</th>
                            <th class="py-3">Dish Name</th>
                            <th class="py-3">Category</th>
                            <th class="py-3">Price</th>
                            <th class="py-3 text-end px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in menu %}
                        <tr>
                            <td class="px-4">{{ item.id }}</td>
                            <td><strong class="fs-5">{{ item.name }}</strong></td>
                            <td><span class="badge bg-dark border border-light rounded-pill">{{ item.category }}</span></td>
                            <td class="text-warning fw-bold fs-5">KSh {{ item.price }}</td>
                            <td class="text-end px-4">
                                <a href="/edit_menu/{{ item.id }}" class="btn btn-sm btn-info text-dark fw-bold rounded-pill px-3">✏️ Edit</a>
                                <a href="/delete_menu/{{ item.id }}" class="btn btn-sm btn-danger fw-bold rounded-pill px-3" onclick="return confirm('Are you sure you want to delete {{ item.name }}?');">🗑️ Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" class="text-center py-5" style="color: rgba(255,255,255,0.6);">
                                <i>No menu items found in the database.</i>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
