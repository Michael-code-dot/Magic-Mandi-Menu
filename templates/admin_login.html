<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Magic Mandi & Grill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #ff6a00, #ee0979);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
        }
        .glass-header {
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            border-radius: 10px;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            border-color: white !important;
        }
        .glass-input::placeholder { color: rgba(255,255,255,0.6) !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card mx-auto text-center">
        <div class="glass-header p-4">
            <h4 class="mb-0 fw-bold">🔒 Admin Login</h4>
        </div>
        <div class="card-body p-4">
            {% if error %}
                <div class="alert alert-danger py-2" style="font-size: 14px;">{{ error }}</div>
            {% endif %}
            
            <form action="/admin/login" method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label text-white">Password</label>
                    <input type="password" class="form-control glass-input py-2" name="password" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn btn-light w-100 fw-bold rounded-pill py-2 text-dark shadow mt-2">Login</button>
            </form>
            <div class="mt-3">
                <a href="/" class="text-white text-decoration-none" style="font-size: 13px; opacity: 0.8;">← Back to Live Menu</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
