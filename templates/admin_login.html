<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Authentication | DEBASA SYSTEMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-surface: #11151c;
            --accent-gold: #f59e0b;
            --brand-red: #dc2626;
            --brand-dark-red: #991b1b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-primary);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 0;
        }

        .glass-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .glass-header {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--border-subtle);
            padding: 28px 20px;
        }

        .debasa-badge {
            color: var(--accent-gold);
            font-weight: 800;
            letter-spacing: 2.5px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .glass-input {
            background: #171d28 !important;
            border: 1px solid var(--border-subtle) !important;
            color: #ffffff !important;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .glass-input:focus {
            background: #1d2533 !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
            border-color: var(--accent-gold) !important;
        }

        .btn-auth-custom {
            background: linear-gradient(135deg, var(--brand-red), var(--brand-dark-red));
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35);
        }

        .btn-auth-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(220, 38, 38, 0.5);
            color: #ffffff;
        }

        .gold-text {
            color: var(--accent-gold) !important;
            font-weight: 700;
        }

        .admin-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            color: #64748b;
            font-size: 0.75rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="glass-card mx-auto text-center">
        <div class="glass-header">
            <span class="debasa-badge d-block mb-1">DEBASA SYSTEMS</span>
            <h4 class="mb-0 fw-bold text-white">Restricted Access</h4>
        </div>
        
        <div class="card-body p-4 p-md-4">
            {% if error %}
                <div class="alert alert-danger py-2 mb-3 bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger" style="font-size: 0.85rem;">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label text-muted fw-medium" style="font-size: 0.8rem;">ADMIN SECURITY CREDENTIAL</label>
                    <input type="password" class="form-control glass-input" name="password" placeholder="Enter secure key..." required autocomplete="current-password">
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-auth-custom">Authorize Session</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="text-secondary text-decoration-none" style="font-size: 0.8rem;">← Return to Client Portal</a>
            </div>

            <footer class="admin-footer text-center">
                <div>© 2026 Magic Mandi & Grill. All Rights Reserved.</div>
                
                <div class="mt-2">
                    <span class="gold-text" style="font-size: 0.8rem;">DEBASA QR ENGINE</span>
                    <div style="font-size: 0.7rem; color: #64748b; text-transform: uppercase;">
                        Architecture by <span class="text-white fw-medium">DEBASA SYSTEMS</span>
                    </div>
                </div>

                <div class="mt-2 text-secondary" style="font-size: 0.68rem;">
                    Support Contact: kingmulkam8@gmail.com
                </div>
            </footer>
        </div>
    </div>
</div>

</body>
</html>
