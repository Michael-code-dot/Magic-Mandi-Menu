<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item | DEBASA</title>
    <meta name="theme-color" content="#000000">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.jpeg') }}">

<style>
    @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
    }

    :root {
        --panel: #060606;
        --line: rgba(255, 215, 120, 0.12);
        --line-hi: rgba(255, 215, 120, 0.32);
        --text: #f6f1e4;
        --text-2: #b9b09a;
        --muted: #7d7562;
        --gold-1: #fff0b8;
        --gold-2: #f5d77a;
        --gold-3: #d9ab36;
        --gold-grad: linear-gradient(135deg, #fff0b8 0%, #f5d77a 28%, #d9ab36 58%, #a8791c 100%);
        --gold-glow: rgba(245, 200, 90, 0.38);
        --green: #4ff0b0;
        --red: #ff6a82;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #000;
        color: var(--text);
        font-family: "Outfit", -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    ::selection { background: var(--gold-3); color: #000; }

    #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .aurora { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .aurora i {
        position: absolute; width: 620px; height: 620px; border-radius: 50%;
        filter: blur(110px); opacity: 0.17;
        background: radial-gradient(circle, var(--gold-3), transparent 70%);
        animation: drift 22s ease-in-out infinite alternate;
    }
    .aurora i:nth-child(1) { top: -260px; right: -120px; }
    .aurora i:nth-child(2) { bottom: -300px; left: -100px; opacity: 0.11; animation-duration: 28s; animation-direction: alternate-reverse; }

    @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-90px, 70px) scale(1.25); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(26px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes sheen { 0% { transform: translateX(-130%); } 55%,100% { transform: translateX(130%); } }
    @keyframes spin { to { --angle: 360deg; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .topbar {
        position: relative; z-index: 2; width: 100%; padding: 24px 6%;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
        position: relative; overflow: hidden; width: 40px; height: 40px;
        display: grid; place-items: center; border-radius: 13px;
        background: var(--gold-grad); color: #1a1204;
        font-family: "Playfair Display", serif; font-size: 20px; font-weight: 800;
        box-shadow: 0 0 0 1px rgba(255,240,184,0.5) inset, 0 0 30px var(--gold-glow);
    }
    .brand-mark::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.75) 50%, transparent 70%);
        transform: translateX(-120%); animation: sheen 4s ease-in-out infinite;
    }
    .brand-text .brand-name {
        font-family: "Playfair Display", serif; font-size: 16px; font-weight: 700; letter-spacing: 2.5px;
        background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text .brand-sub { color: var(--text-2); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; margin-top: 1px; }

    main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 46px 20px; }

    .card {
        position: relative; width: 100%; max-width: 440px; padding: 38px;
        border-radius: 26px; background: var(--panel); isolation: isolate;
        animation: reveal 0.9s var(--ease) both;
    }
    .card::before {
        content: ""; position: absolute; inset: 0; padding: 1.5px; border-radius: 26px;
        background: conic-gradient(from var(--angle), transparent 0%, rgba(217,171,54,0.15) 25%, var(--gold-1) 38%, var(--gold-3) 45%, transparent 55%, transparent 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        animation: spin 6s linear infinite; z-index: -1;
    }
    .card::after {
        content: ""; position: absolute; right: -50px; top: -50px; width: 160px; height: 160px; border-radius: 50%;
        background: radial-gradient(circle, var(--gold-glow), transparent 70%); opacity: 0.5; pointer-events: none; z-index: -1;
    }

    .card-icon {
        width: 50px; height: 50px; display: grid; place-items: center; margin-bottom: 20px;
        border-radius: 15px; color: var(--gold-2); font-size: 20px;
        background: radial-gradient(circle at 30% 25%, rgba(255,240,184,0.25), rgba(217,171,54,0.05));
        border: 1px solid var(--line-hi); box-shadow: 0 0 34px rgba(245,200,90,0.22);
        animation: float 4s ease-in-out infinite;
    }

    h2 { font-family: "Playfair Display", serif; font-size: 25px; font-weight: 600; letter-spacing: -0.5px; color: #fff; }
    .card-description { margin: 8px 0 24px; color: var(--text-2); font-size: 13px; font-weight: 300; line-height: 1.7; }

    .error {
        padding: 13px 16px; margin-bottom: 20px; color: var(--red);
        background: rgba(255,106,130,0.08); border: 1px solid rgba(255,106,130,0.35);
        border-radius: 13px; font-size: 13.5px; line-height: 1.55;
    }

    .field { margin-bottom: 18px; }
    .field-label { display: block; margin-bottom: 10px; color: var(--gold-3); font-size: 10.5px; font-weight: 600; letter-spacing: 2.2px; text-transform: uppercase; }

    input[type="text"], input[type="number"] {
        width: 100%; padding: 14px 16px; outline: none; color: #fff; background: #000;
        border: 1px solid var(--line-hi); border-radius: 14px;
        font-family: inherit; font-size: 14px;
        transition: border-color 0.3s, box-shadow 0.4s;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--gold-2); box-shadow: 0 0 0 4px rgba(245,215,122,0.1), 0 0 34px rgba(245,200,90,0.2); }

    .actions-row { display: flex; gap: 14px; margin-top: 24px; }

    .button {
        position: relative; overflow: hidden; flex: 1; min-height: 50px; padding: 0 20px;
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        border: 1px solid transparent; border-radius: 14px;
        font-family: inherit; font-size: 13.5px; font-weight: 600; letter-spacing: 0.4px;
        cursor: pointer; text-decoration: none;
        transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.3s, border-color 0.3s, color 0.3s;
    }
    .button:hover { transform: translateY(-3px); }
    .button:active { transform: translateY(0) scale(0.97); }

    .button-primary {
        color: #1a1204; background: var(--gold-grad); border: none;
        box-shadow: 0 0 0 1px rgba(255,240,184,0.45) inset, 0 12px 34px rgba(217,171,54,0.3);
    }
    .button-primary::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.7) 50%, transparent 65%);
        transform: translateX(-130%); animation: sheen 4.5s ease-in-out 1.5s infinite;
    }
    .button-primary:hover { box-shadow: 0 0 0 1px rgba(255,240,184,0.7) inset, 0 18px 52px rgba(245,200,90,0.55); }

    .button-secondary { background: transparent; color: var(--gold-2); border-color: var(--line-hi); }
    .button-secondary:hover { background: rgba(245,215,122,0.1); border-color: var(--gold-2); box-shadow: 0 0 28px rgba(245,200,90,0.22); }

    footer { position: relative; z-index: 1; padding: 20px 6%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; }
    footer a { color: inherit; text-decoration: none; }
    .footer-brand { color: var(--gold-3); }

    @media (max-width: 480px) {
        .topbar { padding: 18px 20px; }
        main { padding: 30px 16px; }
        .card { padding: 26px 20px; }
        footer { padding: 16px 20px; flex-direction: column; align-items: center; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        #dust { display: none; }
    }
</style>
</head>

<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>

<header class="topbar">
    <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
            <div class="brand-name">MAGIC MANDI &amp; GRILL</div>
            <div class="brand-sub">Menu Administration</div>
        </div>
    </div>
</header>

<main>
    <section class="card">
        <div class="card-icon">&#9998;</div>

        <h2>Edit dish</h2>
        <p class="card-description">Update the name or price for this item.</p>

        {% if error %}
        <div class="error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/edit_menu/{{ item.id }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label class="field-label" for="name">Dish name</label>
                <input type="text" id="name" name="name" value="{{ item.name }}" required>
            </div>

            <div class="field">
                <label class="field-label" for="price">Price (KSh)</label>
                <input type="number" step="0.01" id="price" name="price" value="{{ item.price }}" required>
            </div>

            <div class="actions-row">
                <a href="/manage_menu" class="button button-secondary">Cancel</a>
                <button type="submit" class="button button-primary">Save changes</button>
            </div>
        </form>
    </section>
</main>

<footer>
    <div>&copy; 2026 Magic Mandi &amp; Grill. All rights reserved.</div>
    <div class="footer-brand">DEBASA QR &middot; <a href="mailto:debasasystems@gmail.com">debasasystems@gmail.com</a></div>
</footer>

<script>
    (function () {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }

        const canvas = document.getElementById("dust");
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let W, H;
        const parts = [];

        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function spawn(initial) {
            return {
                x: Math.random() * W,
                y: initial ? Math.random() * H : H + 10,
                r: Math.random() * 1.6 + 0.4,
                v: Math.random() * 0.35 + 0.08,
                d: (Math.random() - 0.5) * 0.25,
                a: Math.random() * 0.6 + 0.2,
                t: Math.random() * Math.PI * 2
            };
        }

        resize();
        const count = Math.min(60, Math.floor(window.innerWidth / 24));
        for (let i = 0; i < count; i++) { parts.push(spawn(true)); }
        window.addEventListener("resize", resize);

        (function loop() {
            ctx.clearRect(0, 0, W, H);
            parts.forEach(function (p, i) {
                p.y -= p.v; p.x += p.d + Math.sin(p.t) * 0.15; p.t += 0.015;
                if (p.y < -10) { parts[i] = spawn(false); }
                const tw = 0.5 + 0.5 * Math.sin(p.t * 3);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(245,205,100," + (p.a * tw).toFixed(3) + ")";
                ctx.shadowColor = "rgba(245,200,90,0.9)";
                ctx.shadowBlur = 8;
                ctx.fill();
            });
            requestAnimationFrame(loop);
        })();
    })();
</script>

</body>
</html>
