<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">✏️ Edit Price & Name</h4>
        </div>
        <div class="card-body">
            
            <form action="/edit_menu/{{ item.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">Current Dish Name</label>
                    <input type="text" class="form-control" name="name" value="{{ item.name }}" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted">Current Price (KSh)</label>
                    <input type="number" step="0.01" class="form-control" name="price" value="{{ item.price }}" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/manage_menu" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Save Changes</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
