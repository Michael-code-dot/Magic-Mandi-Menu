<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Authentication | DEBASA SYSTEMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030407;
            --bg-surface: #0b0f17;
            --bg-elevated: #131824;
            --accent-gold: #f59e0b;
            --accent-gold-hover: #fbbf24;
            --border-glass: rgba(255, 255, 255, 0.07);
            --border-glass-hover: rgba(245, 158, 11, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px 16px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .executive-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
        }

        .executive-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .card-header-custom {
            padding: 32px 32px 24px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-glass);
            text-align: left;
        }

        .brand-tag {
            font-size: 0.65rem;
            font-weight: 800;}
