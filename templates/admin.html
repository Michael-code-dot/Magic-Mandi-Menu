<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Magic Mandi & Grill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #ff6a00, #ee0979);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 550px;
        }
        .glass-header {
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card mx-auto text-center">
        <div class="glass-header p-4">
            <h3 class="mb-0 fw-bold">✨ Admin Panel</h3>
        </div>
        <div class="card-body p-5">
            <h4 class="mb-3">🍔 Menu Management</h4>
            <p class="mb-4" style="color: rgba(255,255,255,0.7);">Add, edit, or delete your dishes and prices seamlessly.</p>
            
            <div class="d-grid gap-3">
                <a href="/manage_menu" class="btn btn-light fw-bold rounded-pill py-3 text-dark shadow">📋 Manage Menu Items</a>
                <a href="/" class="btn glass-btn rounded-pill py-2">🌐 View Live Menu</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
