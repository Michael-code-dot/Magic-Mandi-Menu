<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DEBASA SYSTEMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-surface: #141720;
            --accent-gold: #ffd700;
            --brand-red: #d32f2f;
            --brand-dark-red: #8b0000;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-primary);
            color: #f3f4f6;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .glass-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }

        .glass-header {
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-subtle);
        }

        .debasa-badge {
            color: var(--accent-gold);
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .glass-btn-primary {
            background: linear-gradient(135deg, var(--brand-red), var(--brand-dark-red));
            color: white;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
        }

        .glass-btn-primary:hover {
            transform: translateY(-2px);
            color: white;
            box-shadow: 0 8px 25px rgba(211, 47, 47, 0.5);
        }

        .glass-btn {
            background: #1c212c;
            border: 1px solid var(--border-subtle);
            color: #9ca3af;
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: #252c3b;
            color: #ffffff;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .floating-unit {
            animation: float 4s ease-in-out infinite;
            display: inline-block;
        }

        .gold-text {
            color: var(--accent-gold) !important;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
            font-weight: 700;
            text-transform: uppercase;
        }

        .admin-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            color: #888888;
            font-size: 0.75rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="glass-card mx-auto text-center">
        <div class="glass-header p-4">
            <span class="debasa-badge d-block mb-1">DEBASA SYSTEMS ADMIN</span>
            <h3 class="mb-0 fw-bold text-white">✨ Admin Panel</h3>
        </div>
        
        <div class="card-body p-4 p-md-5">
            <h4 class="mb-2 text-white fw-bold">🍔 Menu Management</h4>
            <p class="mb-4" style="color: #9ca3af; font-size: 0.9rem;">Add, edit, or delete your dishes and prices seamlessly.</p>
            
            <div class="d-grid gap-3 mb-2">
                <a href="{{ url_for('manage_menu') }}" class="btn glass-btn-primary fw-bold rounded-pill py-3">📋 Manage Menu Items</a>
                <a href="{{ url_for('index') }}" class="btn glass-btn rounded-pill py-2">🌐 View Live Menu</a>
                <a href="{{ url_for('admin_logout') }}" class="btn glass-btn rounded-pill py-2 text-danger">🚪 Logout</a>
            </div>

            <footer class="admin-footer">
                <div>© 2026 Magic Mandi & Grill. All Rights Reserved.</div>
                
                <div class="floating-unit mt-2">
                    <div class="gold-text" style="font-size: 0.95rem; letter-spacing: 1px;">DEBASA QR</div>
                    <div style="font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">
                        Powered by <span class="gold-text">DEBASA SYSTEMS</span>
                    </div>
                </div>

                <div class="mt-2" style="font-size: 0.7rem; color: #666;">
                    Technical Support: contact@debasasystems.com
                </div>
            </footer>
        </div>
    </div>
</div>

</body>
</html>
