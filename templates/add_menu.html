<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Menu Item | DEBASA Systems Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">

<div class="admin-container">
    <h2>➕ Add New Menu Item</h2>
    
    <form action="/add_menu" method="POST" class="admin-form">
        <label for="name">Item Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Camel Meat Kalankal">

        <label for="category">Category</label>
        <select name="category" id="category" required>
            <option value="" disabled selected>Select Category</option>
            <option value="Mandi">Mandi</option>
            <option value="Grill">Grill</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Coffee">Coffee</option>
            <option value="Iced Coffee">Iced Coffee</option>
            <option value="Juices">Juices</option>
            <option value="Milkshakes">Milkshakes</option>
            <option value="Smoothies">Smoothies</option>
            <option value="Mocktails">Mocktails</option>
            <option value="Lemonades">Lemonades</option>
            <option value="Fruit Chillers">Fruit Chillers</option>
            <option value="Burgers">Burgers</option>
            <option value="Pizzas">Pizzas</option>
            <option value="Pastas">Pastas</option>
            <option value="Salads">Salads</option>
            <option value="Specials">Specials</option>
            <option value="Snacks">Snacks</option>
            <option value="Accompaniments">Accompaniments</option>
            <option value="Seafood">Seafood</option>
            <option value="Biryani">Biryani</option>
            <option value="Cakes">Cakes</option>
            <option value="Ice Cream">Ice Cream</option>
            <option value="Kids Menu">Kids Menu</option>
            <option value="Soft drinks">Soft drinks</option>
            <option value="Extra">Extra</option>
            <option value="Add ons">Add ons</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Short description of the meal..."></textarea>

        <label for="price">Price (KSh)</label>
        <input type="number" id="price" name="price" required placeholder="e.g. 900">

        <label for="image">Image Filename or URL</label>
        <input type="text" id="image" name="image" placeholder="e.g. rice.jpg (or full URL)">
        <small class="form-hint">Tip: Just type the filename like <code>camelmeatkalankal.jpg</code> and the system handles the rest automatically!</small>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Item</button>
            <a href="/admin" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
