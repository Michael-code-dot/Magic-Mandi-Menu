<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Dish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">➕ Add New Menu Item</h4>
        </div>
        <div class="card-body">
            
            <form action="/add_menu" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">Dish Name</label>
                    <input type="text" class="form-control" name="name" placeholder="e.g. Chicken Mandi" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Category</label>
                    <select class="form-select" name="category" required>
                        <!-- EDIT THESE TO MATCH YOUR MENU EXACTLY -->
                        <option value="Classic Breakfast">Classic Breakfast</option>
                        <option value="Mandi Specials">Mandi Specials</option>
                        <option value="Grill & BBQ">Grill & BBQ</option>
                        <option value="Appetizers">Appetizers</option>
                        <option value="Hot Beverages">Hot Beverages</option>
                        <option value="Cold Drinks">Cold Drinks</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Description (Optional)</label>
                    <textarea class="form-control" name="description" rows="2" placeholder="Delicious slow-cooked chicken..."></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-muted">Price (KSh)</label>
                    <input type="number" step="0.01" class="form-control" name="price" placeholder="e.g. 1200" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Image Filename</label>
                    <input type="text" class="form-control" name="image" placeholder="e.g. chicken_mandi.jpg" required>
                    <small class="text-muted">Make sure this image is uploaded to your static/images folder.</small>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/manage_menu" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Save New Dish</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
