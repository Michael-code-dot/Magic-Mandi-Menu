<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Dish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #ff6a00, #ee0979);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
        }
        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-header {
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px 20px 0 0;
        }
        
        /* Glass Input Fields */
        .glass-input {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            border-radius: 10px;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            border-color: white !important;
        }
        .glass-input::placeholder { color: rgba(255,255,255,0.6) !important; }
        
        /* Fix for Dropdown Text */
        select.glass-input option {
            background: #2a5298; /* Solid color for options so they are readable */
            color: white;
        }
        
        label { font-weight: 500; letter-spacing: 0.5px; color: rgba(255,255,255,0.9) !important; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="container mt-5 mb-5" style="max-width: 600px;">
    <div class="glass-card">
        <div class="glass-header p-4 text-center">
            <h3 class="mb-0 fw-bold">➕ Add New Menu Item</h3>
        </div>
        <div class="card-body p-4 p-md-5">
            
            <form action="/add_menu" method="POST">
                <div class="mb-4">
                    <label class="form-label">Dish Name</label>
                    <input type="text" class="form-control glass-input py-2" name="name" placeholder="e.g. Chicken Mandi" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Category</label>
                    <select class="form-select glass-input py-2" name="category" required>
                        <option value="Classic Breakfast">Classic Breakfast</option>
                        <option value="Mandi Specials">Mandi Specials</option>
                        <option value="Grill & BBQ">Grill & BBQ</option>
                        <option value="Appetizers">Appetizers</option>
                        <option value="Hot Beverages">Hot Beverages</option>
                        <option value="Cold Drinks">Cold Drinks</option>
                        <option value="Desserts">Desserts</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Description (Optional)</label>
                    <textarea class="form-control glass-input" name="description" rows="2" placeholder="Delicious slow-cooked chicken..."></textarea>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Price (KSh)</label>
                    <input type="number" step="0.01" class="form-control glass-input py-2" name="price" placeholder="e.g. 1200" required>
                </div>

                <div class="mb-5">
                    <label class="form-label">Image Filename</label>
                    <input type="text" class="form-control glass-input py-2" name="image" placeholder="e.g. chicken_mandi.jpg" required>
                    <small style="color: rgba(255,255,255,0.6);">Make sure this image is in your static/images folder.</small>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/manage_menu" class="btn btn-outline-light rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-light fw-bold rounded-pill px-5 text-dark shadow">Save Dish</button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
