<!DOCTYPE html>
<html>
<head>
    <title>Kitchen Receipt</title>

    <style>

        body{
            font-family:Courier New, monospace;
            width:300px;
            margin:auto;
            padding:20px;
        }

        h2{
            text-align:center;
            margin:5px;
        }

        hr{
            border:1px dashed black;
        }

        table{
            width:100%;
        }

        td{
            padding:3px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<h2>MAGIC MADHI & GRILL</h2>

<hr>

<p><strong>Order:</strong> #{{ order.id }}</p>

<p><strong>Table:</strong> {{ order.table_number }}</p>

<p><strong>Waiter:</strong> {{ order.waiter_name }}</p>

<p><strong>Status:</strong> {{ order.status }}</p>

<hr>

<table>

{% for item in items %}

<tr>

<td>{{ item.quantity }} x {{ item.menu_name }}</td>

<td style="text-align:right">
KSh {{ item.price * item.quantity }}
</td>

</tr>

{% endfor %}

</table>

<hr>

<h3>Total: KSh {{ order.total }}</h3>

<hr>

<p style="text-align:center">
Thank You
</p>

<button onclick="window.print()">
🖨 Print Receipt
</button>

</body>
</html>
