<!DOCTYPE html>
<html>
<head>
    <title>Add Menu Item</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:40px;
        }

        form{
            background:white;
            width:400px;
            margin:auto;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        h1{
            text-align:center;
        }
    </style>

</head>

<body>

<h1>Add New Menu Item</h1>

<form method="POST">

    <label>Food Name</label><br>
    <input type="text" name="name" required><br><br>

    <label>Category</label><br>
    <select name="category" required>
        <option>Main Meals</option>
        <option>Fast Food</option>
        <option>Drinks</option>
        <option>Desserts</option>
        <option>Breakfast</option>
    </select><br><br>

    <label>Description</label><br>
    <textarea name="description"></textarea><br><br>

    <label>Price</label><br>
    <input type="number" name="price" required><br><br>

    <label>Image Filename</label><br>
    <input type="text" name="image" placeholder="pilau.jpg"><br><br>

    <button type="submit">
        Add Food
    </button>

</form>

</body>
</html>
