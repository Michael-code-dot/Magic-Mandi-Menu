<!DOCTYPE html>
<html>
<head>
    <title>Edit Menu Item</title>
    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:40px;
        }

        form{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:#2196F3;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        h1{
            text-align:center;
        }
    </style>
</head>

<body>

<h1>Edit Menu Item</h1>

<form method="POST">

    <input
        type="text"
        name="name"
        value="{{ item.name }}"
        required>

    <input
        type="number"
        name="price"
        value="{{ item.price }}"
        required>

    <button type="submit">
        Save Changes
    </button>

</form>

</body>
</html>
