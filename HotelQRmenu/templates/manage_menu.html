<!DOCTYPE html>
<html>
<head>
    <title>Manage Menu</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f4f4;
            padding:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th, td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        a{
            text-decoration:none;
        }

        .edit{
            background:#2196F3;
            color:white;
            padding:8px 12px;
            border-radius:5px;
        }

        .delete{
            background:red;
            color:white;
            padding:8px 12px;
            border-radius:5px;
        }
    </style>
</head>

<body>

<h1>🍽 Manage Menu</h1>

<table>

<tr>
    <th>ID</th>
    <th>Food</th>
    <th>Price</th>
    <th>Actions</th>
</tr>

{% for item in menu %}

<tr>

<td>{{ item.id }}</td>

<td>{{ item.name }}</td>

<td>KSh {{ item.price }}</td>

<td>

<a class="edit" href="/edit_menu/{{ item.id }}">
Edit
</a>

<a class="delete" href="/delete_menu/{{ item.id }}">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
